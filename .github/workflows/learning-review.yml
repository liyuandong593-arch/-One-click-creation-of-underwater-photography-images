name: Underwater Learning Intake

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write
  contents: read

jobs:
  classify-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Classify new feedback
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || "";
            const body = issue.body || "";
            const text = `${title}\n${body}`.toLowerCase();

            const labels = new Set();

            // Main feedback type
            if (title.startsWith("[Feedback]")) {
              labels.add("feedback");
              labels.add("learning-candidate");
            }

            if (title.startsWith("[Failure]")) {
              labels.add("failure");
              labels.add("learning-candidate");
            }

            // Mode
            if (text.includes("hero")) {
              labels.add("mode-hero");
            }

            if (text.includes("natural")) {
              labels.add("mode-natural");
            }

            // Scene classification
            if (
              text.includes("fish") ||
              text.includes("鱼")
            ) {
              labels.add("scene-fish");
            }

            if (
              text.includes("coral") ||
              text.includes("reef") ||
              text.includes("珊瑚")
            ) {
              labels.add("scene-coral");
            }

            if (
              text.includes("person") ||
              text.includes("skin") ||
              text.includes("face") ||
              text.includes("人物") ||
              text.includes("肤色") ||
              text.includes("脸")
            ) {
              labels.add("scene-person");
            }

            if (
              text.includes("deep water") ||
              text.includes("deep-water") ||
              text.includes("深水")
            ) {
              labels.add("scene-deep-water");
            }

            if (
              text.includes("artificial light") ||
              text.includes("人工光")
            ) {
              labels.add("scene-artificial-light");
            }

            // Failure classification
            if (
              text.includes("too blue") ||
              text.includes("cyan") ||
              text.includes("green") ||
              text.includes("hazy") ||
              text.includes("海水") ||
              text.includes("水体")
            ) {
              labels.add("failure-water");
            }

            if (
              text.includes("skin") ||
              text.includes("face changed") ||
              text.includes("hands") ||
              text.includes("fingers") ||
              text.includes("肤色") ||
              text.includes("手指")
            ) {
              labels.add("failure-person");
            }

            if (
              text.includes("fish distorted") ||
              text.includes("fish count") ||
              text.includes("fish direction") ||
              text.includes("鱼群") ||
              text.includes("鱼变形")
            ) {
              labels.add("failure-fish");
            }

            if (
              text.includes("fake") ||
              text.includes("light direction") ||
              text.includes("光源") ||
              text.includes("光线")
            ) {
              labels.add("failure-light");
            }

            const labelNames = [...labels];

            // Automatically create labels if they do not exist
            const existing = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const existingNames = new Set(
              existing.map(label => label.name)
            );

            for (const label of labelNames) {
              if (!existingNames.has(label)) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: "DDEEFF",
                    description: "Automatically generated by Underwater Colorist learning workflow"
                  });
                } catch (error) {
                  console.log(`Could not create label ${label}: ${error.message}`);
                }
              }
            }

            // Add labels
            if (labelNames.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelNames
              });
            }

            // Add learning-system comment
            const marker = "<!-- underwater-learning-intake -->";

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });

            const alreadyCommented = comments.data.some(
              comment => comment.body && comment.body.includes(marker)
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}
            ## Underwater Colorist Learning Intake

            This case has been added to the learning pipeline.

            It will be evaluated as one or more of:

            - Successful-rule candidate
            - Failure-rule candidate
            - Rule-revision candidate

            Candidate findings are not automatically promoted into production rules.

            Repeated evidence and human review are required before updating the official Skill rule library.`
              });
            }
