name: Underwater Learning Intake

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write
  contents: read

jobs:
  classify-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Classify feedback
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || "";
            const body = issue.body || "";

            // ==================================================
            // Helpers
            // ==================================================

            function normalize(text) {
              return (text || "")
                .toLowerCase()
                .replace(/\r/g, "")
                .trim();
            }

            function extractSection(body, heading) {
              const escaped = heading.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
              );

              const regex = new RegExp(
                `###\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n###\\s+|$)`,
                "i"
              );

              const match = body.match(regex);

              if (!match) return "";

              return match[1]
                .replace(/_No response_/gi, "")
                .trim();
            }

            function getCheckedItems(section) {
              return section
                .split("\n")
                .filter(line =>
                  /^\s*-\s*\[[xX]\]/.test(line)
                )
                .map(line =>
                  line
                    .replace(
                      /^\s*-\s*\[[xX]\]\s*/,
                      ""
                    )
                    .trim()
                );
            }

            function includesAny(text, keywords) {
              const normalized = normalize(text);

              return keywords.some(keyword =>
                normalized.includes(
                  normalize(keyword)
                )
              );
            }

            const autoLabels = new Set();

            // ==================================================
            // Determine issue type
            // ==================================================

            const isFeedback =
              title.startsWith("[Feedback]");

            const isFailure =
              title.startsWith("[Failure]");

            if (!isFeedback && !isFailure) {
              console.log(
                "Not an Underwater Colorist feedback issue."
              );
              return;
            }

            autoLabels.add("learning-candidate");

            if (isFeedback) {
              autoLabels.add("feedback");
            }

            if (isFailure) {
              autoLabels.add("failure");
            }

            // ==================================================
            // Extract structured data
            // ==================================================

            // Feedback template
            const feedbackScene = extractSection(
              body,
              "Scene Type"
            );

            const gradingMode = extractSection(
              body,
              "Grading Mode"
            );

            const workedWell = extractSection(
              body,
              "What worked well?"
            );

            const feedbackFailure = extractSection(
              body,
              "What failed?"
            );

            const problemsSection = extractSection(
              body,
              "Problems observed"
            );

            // Failure report template
            const failureScene = extractSection(
              body,
              "Scene"
            );

            const failureDescription =
              extractSection(
                body,
                "Failure Description"
              );

            const severity = extractSection(
              body,
              "Severity"
            );

            const repeatability = extractSection(
              body,
              "Is this repeatable?"
            );

            // Prefer structured scene field
            const scene = normalize(
              feedbackScene || failureScene
            );

            const failureText = normalize(
              feedbackFailure ||
              failureDescription
            );

            const mode = normalize(
              gradingMode
            );

            const checkedProblems =
              getCheckedItems(
                problemsSection
              ).map(normalize);

            const problemSet =
              new Set(checkedProblems);

            // ==================================================
            // Mode classification
            // ==================================================

            if (mode === "hero") {
              autoLabels.add("mode-hero");
            }

            if (mode === "natural") {
              autoLabels.add("mode-natural");
            }

            // ==================================================
            // Scene classification
            // ==================================================

            if (
              includesAny(scene, [
                "person + fish school",
                "人物 + 鱼群",
                "人+鱼群"
              ])
            ) {
              autoLabels.add("scene-person");
              autoLabels.add("scene-fish");
            }

            else if (
              includesAny(scene, [
                "person + large marine animal",
                "大型海洋生物",
                "鲸鲨",
                "鲨鱼",
                "海龟",
                "manta",
                "whale shark"
              ])
            ) {
              autoLabels.add("scene-person");
              autoLabels.add(
                "scene-marine-animal"
              );
            }

            else if (
              includesAny(scene, [
                "underwater person",
                "水下人物",
                "人物"
              ])
            ) {
              autoLabels.add("scene-person");
            }

            else if (
              includesAny(scene, [
                "coral",
                "reef",
                "珊瑚",
                "礁"
              ])
            ) {
              autoLabels.add("scene-coral");
            }

            else if (
              includesAny(scene, [
                "wreck",
                "structure",
                "沉船",
                "结构"
              ])
            ) {
              autoLabels.add("scene-structure");
            }

            else if (
              includesAny(scene, [
                "underwater environment",
                "environment",
                "纯环境",
                "水下环境"
              ])
            ) {
              autoLabels.add(
                "scene-environment"
              );
            }

            // Extra scene signals for free-text
            if (
              includesAny(scene, [
                "deep water",
                "deep-water",
                "深水"
              ])
            ) {
              autoLabels.add(
                "scene-deep-water"
              );
            }

            if (
              includesAny(scene, [
                "artificial light",
                "人工光",
                "潜水灯"
              ])
            ) {
              autoLabels.add(
                "scene-artificial-light"
              );
            }

            // ==================================================
            // Failure classification
            // ==================================================

            // Water
            if (
              problemSet.has(
                "water too blue / cyan / green"
              ) ||
              problemSet.has(
                "water still hazy"
              ) ||
              includesAny(
                failureText,
                [
                  "water too blue",
                  "water was too blue",
                  "too cyan",
                  "too green",
                  "water still hazy",
                  "海水太蓝",
                  "水体太蓝",
                  "偏蓝",
                  "偏青",
                  "偏绿",
                  "水体浑浊",
                  "海水浑浊"
                ]
              )
            ) {
              autoLabels.add("failure-water");
            }

            // Person
            if (
              problemSet.has(
                "skin tone incorrect"
              ) ||
              problemSet.has(
                "face changed"
              ) ||
              problemSet.has(
                "hands / fingers changed"
              ) ||
              includesAny(
                failureText,
                [
                  "skin tone",
                  "face changed",
                  "hands changed",
                  "fingers changed",
                  "肤色",
                  "脸变",
                  "人脸变",
                  "手指",
                  "手变形"
                ]
              )
            ) {
              autoLabels.add("failure-person");
            }

            // Fish
            if (
              problemSet.has(
                "fish distorted"
              ) ||
              problemSet.has(
                "fish count changed"
              ) ||
              problemSet.has(
                "fish direction changed"
              ) ||
              includesAny(
                failureText,
                [
                  "fish distorted",
                  "fish became distorted",
                  "fish count",
                  "fish direction",
                  "鱼变形",
                  "鱼群变形",
                  "鱼扭曲",
                  "鱼数量",
                  "鱼的数量",
                  "鱼方向",
                  "鱼的方向"
                ]
              )
            ) {
              autoLabels.add("failure-fish");
            }

            // Coral
            if (
              problemSet.has(
                "coral color unrealistic"
              ) ||
              includesAny(
                failureText,
                [
                  "coral color",
                  "reef color",
                  "珊瑚颜色",
                  "珊瑚偏黄",
                  "珊瑚偏橙"
                ]
              )
            ) {
              autoLabels.add("failure-coral");
            }

            // Lighting
            if (
              problemSet.has(
                "artificial light looks fake"
              ) ||
              includesAny(
                failureText,
                [
                  "artificial light",
                  "fake light",
                  "light direction changed",
                  "光源太假",
                  "假光",
                  "光线方向",
                  "光源方向"
                ]
              )
            ) {
              autoLabels.add("failure-light");
            }

            // Content preservation
            if (
              problemSet.has(
                "composition changed"
              ) ||
              problemSet.has(
                "new objects appeared"
              ) ||
              includesAny(
                failureText,
                [
                  "composition changed",
                  "new object",
                  "object disappeared",
                  "构图改变",
                  "构图变化",
                  "新增物体",
                  "新增鱼",
                  "物体消失"
                ]
              )
            ) {
              autoLabels.add(
                "failure-content"
              );
            }

            // Overprocessing
            if (
              problemSet.has(
                "image looks overprocessed"
              ) ||
              includesAny(
                failureText,
                [
                  "overprocessed",
                  "over-processed",
                  "ai-looking",
                  "过度处理",
                  "ai感",
                  "太假"
                ]
              )
            ) {
              autoLabels.add(
                "failure-overprocessing"
              );
            }

            // ==================================================
            // Success signal
            // ==================================================

            if (
              normalize(workedWell).length >= 5
            ) {
              autoLabels.add("success-signal");
            }

            // ==================================================
            // Severity
            // ==================================================

            if (
              normalize(severity) === "critical"
            ) {
              autoLabels.add(
                "severity-critical"
              );
            }

            if (
              normalize(severity) === "major"
            ) {
              autoLabels.add(
                "severity-major"
              );
            }

            if (
              normalize(severity) === "minor"
            ) {
              autoLabels.add(
                "severity-minor"
              );
            }

            // ==================================================
            // Repeatability
            // ==================================================

            if (
              includesAny(
                repeatability,
                [
                  "multiple",
                  "repeat",
                  "多张",
                  "重复",
                  "多次",
                  "again"
                ]
              )
            ) {
              autoLabels.add(
                "repeatable-signal"
              );
            }

            // ==================================================
            // Managed label rules
            // ==================================================

            const managedExact = new Set([
              "feedback",
              "failure",
              "learning-candidate",
              "success-signal",
              "repeatable-signal"
            ]);

            const managedPrefixes = [
              "mode-",
              "scene-",
              "failure-",
              "severity-"
            ];

            function isManagedLabel(name) {
              if (managedExact.has(name)) {
                return true;
              }

              return managedPrefixes.some(
                prefix =>
                  name.startsWith(prefix)
              );
            }

            // ==================================================
            // Preserve manually added labels
            // ==================================================

            const currentLabels =
              (issue.labels || [])
                .map(label =>
                  typeof label === "string"
                    ? label
                    : label.name
                );

            const manualLabels =
              currentLabels.filter(
                label =>
                  !isManagedLabel(label)
              );

            // ==================================================
            // Ensure required auto labels exist
            // ==================================================

            const autoLabelNames =
              [...autoLabels];

            const existingLabels =
              await github.paginate(
                github.rest.issues.listLabelsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100
                }
              );

            const existingNames =
              new Set(
                existingLabels.map(
                  label => label.name
                )
              );

            for (
              const label of autoLabelNames
            ) {
              if (
                !existingNames.has(label)
              ) {
                try {
                  await github.rest.issues.createLabel({
                    owner:
                      context.repo.owner,
                    repo:
                      context.repo.repo,
                    name: label,
                    color: "DDEEFF",
                    description:
                      "Automatically generated by Underwater Colorist learning workflow"
                  });
                } catch (error) {
                  console.log(
                    `Could not create label ${label}: ${error.message}`
                  );
                }
              }
            }

            // ==================================================
            // Replace managed labels in one operation
            // Preserve manual labels
            // ==================================================

            const finalLabels = [
              ...new Set([
                ...manualLabels,
                ...autoLabelNames
              ])
            ];

            await github.rest.issues.setLabels({
              owner:
                context.repo.owner,
              repo:
                context.repo.repo,
              issue_number:
                issue.number,
              labels:
                finalLabels
            });

            // ==================================================
            // Learning bot comment
            // ==================================================

            const marker =
              "<!-- underwater-learning-intake -->";

            const comments =
              await github.paginate(
                github.rest.issues.listComments,
                {
                  owner:
                    context.repo.owner,
                  repo:
                    context.repo.repo,
                  issue_number:
                    issue.number,
                  per_page: 100
                }
              );

            const existingBotComment =
              comments.find(
                comment =>
                  comment.body &&
                  comment.body.includes(
                    marker
                  )
              );

            const commentBody = `${marker}
            ## Underwater Colorist Learning Intake

            This case is part of the learning pipeline.

            ### Current classification

            ${autoLabelNames
              .sort()
              .map(
                label =>
                  `- \`${label}\``
              )
              .join("\n")}

            ### Learning policy

            This case may contribute to:

            - Successful-rule candidates
            - Failure-rule candidates
            - Rule-revision candidates

            Feedback does **not** directly modify the production Skill.

            Repeated evidence and human review are required before a candidate rule is promoted into the official rule library.
            `;

            if (existingBotComment) {
              await github.rest.issues.updateComment({
                owner:
                  context.repo.owner,
                repo:
                  context.repo.repo,
                comment_id:
                  existingBotComment.id,
                body:
                  commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner:
                  context.repo.owner,
                repo:
                  context.repo.repo,
                issue_number:
                  issue.number,
                body:
                  commentBody
              });
            }

            // ==================================================
            // Debug
            // ==================================================

            console.log(
              "Issue:",
              issue.number
            );

            console.log(
              "Scene:",
              scene
            );

            console.log(
              "Mode:",
              mode
            );

            console.log(
              "Checked problems:",
              checkedProblems
            );

            console.log(
              "Failure text:",
              failureText
            );

            console.log(
              "Manual labels preserved:",
              manualLabels
            );

            console.log(
              "Final auto labels:",
              autoLabelNames
            );

            console.log(
              "Final labels:",
              finalLabels
            );
