name: Underwater Grading Feedback
description: Submit a real underwater grading test result.
title: "[Feedback] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Underwater Colorist.
        Please provide real test information so the rule system can improve.

  - type: input
    id: device
    attributes:
      label: Device / Camera
      placeholder: DJI Action 4 / GoPro / Sony / iPhone / Other
    validations:
      required: true

  - type: input
    id: depth
    attributes:
      label: Approximate Depth
      placeholder: e.g. 5m / 15m / 30m
    validations:
      required: false

  - type: dropdown
    id: scene
    attributes:
      label: Scene Type
      options:
        - Underwater person
        - Person + fish school
        - Person + large marine animal
        - Coral / reef
        - Underwater environment
        - Wreck / structure
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Grading Mode
      options:
        - Natural
        - Hero
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: What worked well?
      description: Describe the parts that clearly improved.
      placeholder: Water clarity improved, skin tone became more natural...
    validations:
      required: false

  - type: textarea
    id: failure
    attributes:
      label: What failed?
      description: Describe the main problem.
      placeholder: Fish changed direction, person became too orange...
    validations:
      required: true

  - type: checkboxes
    id: problems
    attributes:
      label: Problems observed
      options:
        - label: Water too blue / cyan / green
        - label: Water still hazy
        - label: Skin tone incorrect
        - label: Face changed
        - label: Hands / fingers changed
        - label: Fish distorted
        - label: Fish count changed
        - label: Fish direction changed
        - label: New objects appeared
        - label: Coral color unrealistic
        - label: Artificial light looks fake
        - label: Composition changed
        - label: Image looks overprocessed

  - type: textarea
    id: media
    attributes:
      label: Before / After
      description: Upload or link the original image and result image.
      placeholder: Drag images here or paste links.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      placeholder: Any other useful information.

  - type: checkboxes
    id: permission
    attributes:
      label: Permission
      options:
        - label: I allow this feedback to be used for rule improvement.
          required: true
